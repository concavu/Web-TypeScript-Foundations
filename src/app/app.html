<div class="container">
  <header>
    <h1>Danh Sách Thành Viên Đội Ngũ ({{ title() }})</h1>
    <p>Phase 1 - Angular v21 Assignment</p>
  </header>

  <!-- Nút lọc theo phòng ban -->
  <div class="filter-actions" style="margin: 20px 0;">
    <button (click)="filterByDepartment('')" style="margin-right: 10px; padding: 8px 15px;">Tất cả</button>
    <button (click)="filterByDepartment('Engineering')" style="margin-right: 10px; padding: 8px 15px;">Engineering</button>
    <button (click)="filterByDepartment('Design')" style="padding: 8px 15px;">Design</button>
  </div>

  <!-- Danh sách dạng lưới (Grid) -->
  <div class="employee-grid">
    <div *ngFor="let emp of employees" class="employee-card">
      <img [src]="emp.avatarUrl" [alt]="emp.name" class="avatar" />
      <h3>{{ emp.name }}</h3>
      <p class="role">{{ emp.role }}</p>
      <p class="dept">Phòng ban: {{ emp.department }}</p>
      <span [ngClass]="emp.isActive ? 'badge active' : 'badge inactive'">
        {{ emp.isActive ? 'Đang hoạt động' : 'Tạm nghỉ' }}
      </span>
    </div>
  </div>

  <!-- Router Outlet cho các trang sau -->
  <router-outlet></router-outlet>
</div>
